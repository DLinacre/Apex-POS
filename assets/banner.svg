<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" fill="none">
  <defs>
    <linearGradient id="apexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <pattern id="gridApex" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10B981" stroke-opacity="0.08" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="url(#apexGrad)" />
  <rect width="1280" height="360" fill="url(#gridApex)" />

  <!-- Apex POS Emblem Container -->
  <rect x="70" y="65" width="230" height="230" rx="36" fill="#064e3b" fill-opacity="0.6" stroke="#10B981" stroke-opacity="0.4" stroke-width="2" />
  
  <!-- POS Cash Terminal Vector Icon -->
  <g transform="translate(105, 100) scale(1.6)">
    <rect x="3" y="4" width="18" height="12" rx="2" fill="none" stroke="url(#emeraldGlow)" stroke-width="2"/>
    <line x1="7" y1="20" x2="17" y2="20" stroke="url(#emeraldGlow)" stroke-width="2"/>
    <line x1="12" y1="16" x2="12" y2="20" stroke="url(#emeraldGlow)" stroke-width="2"/>
    <line x1="7" y1="8" x2="17" y2="8" stroke="#34D399" stroke-width="1.5" stroke-dasharray="2 2"/>
  </g>

  <!-- Typography -->
  <text x="340" y="110" fill="#34D399" font-family="monospace" font-size="16" font-weight="700" letter-spacing="2">HIGH-PERFORMANCE POINT OF SALE ENGINE</text>
  <text x="336" y="180" fill="#F8FAFC" font-family="sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5">Apex POS</text>
  <text x="340" y="225" fill="#94A3B8" font-family="sans-serif" font-size="22">Vue.js · Instant Thermal Receipts · Subsecond Inventory Search</text>

  <!-- Badge -->
  <rect x="340" y="255" width="280" height="42" rx="21" fill="#065f46" stroke="#10B981" stroke-opacity="0.5" stroke-width="1.5" />
  <circle cx="365" cy="276" r="6" fill="#34D399" />
  <text x="382" y="281" fill="#A7F3D0" font-family="monospace" font-size="14" font-weight="700">VERIFIED RETAIL READY</text>
</svg>
